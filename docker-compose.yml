version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    user: "0:0"
    restart: always
    ports:
      - 2181:2181
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - ./zookeeper-data:/var/lib/zookeeper/data
      - ./zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "sh", "-c", "echo > /dev/tcp/127.0.0.1/2181"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    user: "0:0"
    restart: always
    depends_on:
      - zookeeper
    ports:
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 10   # ?? default partitions
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 100
      KAFKA_JMX_PORT: 9991
      KAFKA_LOG4J_ROOT_LOGLEVEL: INFO
    volumes:
      - ./kafka-data:/var/lib/kafka/data

  goflow2:
    image: netsampler/goflow2
    container_name: goflow2
    restart: always
    depends_on:
      - kafka
    ports:
      - 8080:8080
      - 6343:6343/udp
      - 2055:2055/udp
    entrypoint: ["/bin/sh", "-c", "sleep 20 && exec /goflow2 \"$@\"", "--"]
    command:
      - -transport=kafka
      - -transport.kafka.brokers=kafka:9092
      - -transport.kafka.topic=flows
      - -format=json

  clickhouse:
    image: clickhouse/clickhouse-server:24.11.1.2557-alpine
    container_name: clickhouse
    restart: always
    depends_on:
      - kafka
    ports:
      - 8123:8123
      - 9000:9000
    environment:
      - TZ=Asia/Tehran
    volumes:
      - ./clickhouse-data-1:/var/lib/clickhouse
      - ./clickhouse:/docker-entrypoint-initdb.d/
      - ./clickhouse/remote_servers.xml:/etc/clickhouse-server/config.d/remote_servers.xml
      - ./clickhouse/flow.proto:/var/lib/clickhouse/format_schemas/flow.proto
      - ./clickhouse/protocols.csv:/var/lib/clickhouse/user_files/protocols.csv

  clickhouse2:
    image: clickhouse/clickhouse-server:24.11.1.2557-alpine
    container_name: clickhouse2
    restart: always
    depends_on:
      - kafka
    ports:
      - 8125:8123
      - 9001:9000
    environment:
      - TZ=Asia/Tehran
    volumes:
      - ./clickhouse-data-2:/var/lib/clickhouse
      - ./clickhouse:/docker-entrypoint-initdb.d/
      - ./clickhouse/remote_servers.xml:/etc/clickhouse-server/config.d/remote_servers.xml
      - ./clickhouse/flow.proto:/var/lib/clickhouse/format_schemas/flow.proto
      - ./clickhouse/protocols.csv:/var/lib/clickhouse/user_files/protocols.csv

  mariadb:
    image: mariadb:10.11
    container_name: mariadb
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mypassword
      MYSQL_DATABASE: grafanadb
      MYSQL_USER: grafana
      MYSQL_PASSWORD: grafanapassword
    volumes:
      - ./mariadb-data:/var/lib/mysql

  grafana:
    image: grafana/grafana:10.3.3
    container_name: grafana
    user: "0:0"
    restart: always
    ports:
      - 3000:3000
    environment:
      - GF_SECURITY_ADMIN_USER=javad
      - GF_SECURITY_ADMIN_PASSWORD=javad
      - GF_DATABASE_TYPE=mysql
      - GF_DATABASE_HOST=mariadb:3306
      - GF_DATABASE_NAME=grafanadb
      - GF_DATABASE_USER=grafana
      - GF_DATABASE_PASSWORD=grafanapassword
      - GF_PATHS_PLUGINS=/var/lib/grafana/plugins
    volumes:
      - ./grafana-data:/var/lib/grafana
      - ./grafana/plugins:/var/lib/grafana/plugins
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    depends_on:
      - prometheus
      - mariadb

  prometheus:
    user: root
    image: prom/prometheus:v3.0.1
    container_name: prometheus
    restart: always
    ports:
      - 9090:9090
    volumes:
      - ./prometheus-data:/prometheus
      - ./prometheus:/etc/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus/data
      - --storage.tsdb.retention.time=1d

  console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: console
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - 8081:8080
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers:
            - "kafka:9092"
        server:
          listenPort: 8080
    entrypoint: /bin/sh
    command: -c "echo \"$${CONSOLE_CONFIG_FILE}\" > /tmp/config.yml && /app/console --config.filepath=/tmp/config.yml"

  clickhouse-ui:
    image: spoonest/clickhouse-tabix-web-client:latest
    container_name: clickhouse-ui
    ports:
      - 8124:80
    depends_on:
      - clickhouse
    restart: always

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  grafana-data:
  prometheus-data:
  mariadb-data:
  clickhouse-data-1:
  clickhouse-data-2:
